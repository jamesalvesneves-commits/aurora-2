name: Create release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d '\n\r' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "AURORA 2 v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "AURORA 2 v${{ steps.version.outputs.version }}" \
            --notes "Primeira release estável do fluxo de produção musical do AURORA 2.

- Exportador MIDI offline
- Criação de sessão .ardour e importação de MIDI
- Abridor de sessão Ardour
- Fluxo integrado e CLI
- Integração OSC
- Instalador e documentação
- Testes validados no Ubuntu e Windows"
